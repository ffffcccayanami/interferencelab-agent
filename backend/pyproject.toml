[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inferencelab-agent"
version = "0.1.0"
description = "InferenceLab Agent - 推理实验分析与技术研究工作台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26.0,<3.0.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP038：isinstance 里的元组写法在 3.11 上更直观，且与第三方类型判断惯例一致
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"app/validation/scripts/*" = ["T201"]
